global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules live in their own files so promtool can check them in isolation.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # The worker, which is where the AI actually runs: the planner and every
  # activity are tasks, so the token, cost and latency metrics are recorded
  # here and nowhere else. Same profiles as the api target.
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9200"]

  # Celery task events (succeeded, failed, retried) come from Flower, which
  # exposes them in Prometheus format. Flower runs under the dev/production
  # profiles, so this target is down when only the observability profile is
  # up. That is expected, and no rule alerts on it being absent.
  - job_name: flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
