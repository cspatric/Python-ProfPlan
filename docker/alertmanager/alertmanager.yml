# Alertmanager: deduplicates, groups and routes what Prometheus fires.
#
# Out of the box everything lands in the Alertmanager UI on :9093 and nowhere
# else, so the pipeline is complete and verifiable without any secret. Sending
# alerts to Slack or email is the commented block below plus one file.

global:
  resolve_timeout: 5m

route:
  receiver: default
  # Group by alert and severity so one incident is one notification, not one
  # per firing series.
  group_by: ["alertname", "severity"]
  # Wait a little before the first notification, in case related alerts are
  # about to fire and belong in the same message.
  group_wait: 30s
  group_interval: 5m
  # How often to re-send an alert that is still firing. Four hours is a
  # compromise: often enough not to be forgotten, rare enough not to be muted.
  repeat_interval: 4h

  routes:
    # The heartbeat must never notify a human. Its job is to be visible to a
    # dead-man's-switch monitor, if you ever wire one up.
    - matchers:
        - alertname = "Watchdog"
      receiver: "null"
      group_wait: 0s
      repeat_interval: 1h

# When the API is down, half the other rules fire too. Suppress them so the
# notification says "the API is down", not fifteen consequences of that.
inhibit_rules:
  - source_matchers:
      - alertname = "ApiDown"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["job"]

  # A critical alert supersedes a warning about the same thing.
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname"]

receivers:
  - name: "null"

  - name: default
    # Nothing configured: alerts are visible at http://localhost:9093 and are
    # not pushed anywhere. To send them to Slack:
    #
    #   1. Create an incoming webhook in Slack.
    #   2. Write the URL, and nothing else, to
    #      docker/alertmanager/slack_api_url (git-ignored).
    #   3. Uncomment the block below and restart Alertmanager.
    #
    # slack_configs:
    #   - api_url_file: /etc/alertmanager/slack_api_url
    #     channel: "#alerts"
    #     send_resolved: true
    #     title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}{{ .Annotations.summary }}
    #       {{ .Annotations.description }}
    #       runbook: {{ .Annotations.runbook }}
    #       {{ end }}
